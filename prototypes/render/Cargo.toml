[package]
name = "render-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Real Engine technology spike: wgpu 30 + winit 0.30 + egui 0.36, headless and windowed"
license = "MIT OR Apache-2.0"

# A standalone project with its own Cargo.lock: the empty table keeps it out of
# any Cargo workspace defined in a parent directory.
[workspace]

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
png = "0.18.1"
log = "0.4.34"
env_logger = "0.11.11"
