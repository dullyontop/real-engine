# TEMPORARY (WP18 PR "d2"): blesses the dx12 and metal golden sets for the
# island and the plaza on the platform runners and commits them to this branch,
# because the images cannot be fetched from the runners otherwise. The PR
# removes this file before it is merged, together with ci.yml's missing-set rule.

name: Bless platform goldens (WP18 d2, temporary)

on:
  push:
    branches: [claude/m3-wp18-platforms-d2-d8ecfk]

concurrency:
  group: bless-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bless:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            backend: dx12
          - os: macos-latest
            backend: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Bless missing ${{ matrix.backend }} sets
        shell: bash
        env:
          RE_BACKENDS: ${{ matrix.backend }}
        run: |
          todo=""
          for p in island plaza; do
            [ -d "examples/$p/tests/goldens/$RE_BACKENDS" ] || todo="$todo $p"
          done
          if [ -z "$todo" ]; then echo "every $RE_BACKENDS set exists"; exit 0; fi
          cargo build --locked --release -p re_cli
          for p in $todo; do
            target/release/real verify --project "examples/$p" --update-goldens --json > "verify-$p.json" || true
            jq -r '.stages[] | "\(.name): ok=\(.ok)"' "verify-$p.json"
            ls -l "examples/$p/tests/goldens/$RE_BACKENDS"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/*/tests/goldens/$RE_BACKENDS
          git commit -m "WP18 d2: bless the $RE_BACKENDS golden sets on $RUNNER_OS (temporary workflow)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
