# Release assets for Real Engine.
#
# The prebuilt runtimes, for `real build --runtime` where the `real` that runs
# has no engine source to build one from. `real build --runtime-only` writes
# each runtime folder: the game runtime (ADR-0037) with its `runtime.json` and
# its THIRD_PARTY_NOTICES.txt, or the web runtime's files (ADR-0049, WP29 PR
# "runtime"; `RUNTIME_FILES` in crates/re_cli/src/build/web.rs). They are packed
# as real-runtime-<version>-<target>.tar.gz (.zip on Windows) and
# real-web-runtime-<version>.tar.gz. A tag `v*` attaches them to that tag's
# GitHub release (creating the release if needed); a manual run keeps them as
# workflow artifacts only. Tools and versions are ci.yml's.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  desktop-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the runtime needs at most glibc 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
        if: runner.os == 'Linux'
      - run: rustup toolchain install stable --profile minimal
        if: runner.os != 'Linux'
      - name: Build the runtime folder
        id: build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then version="$(git rev-parse --short HEAD)"; fi
          name="real-runtime-$version-${{ matrix.target }}"
          cargo build --locked --release -p re_cli
          target/release/real build --runtime-only --target "${{ matrix.target }}" --out "target/$name"
          rm "target/$name/.real-build"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Pack the runtime
        id: pack
        shell: bash
        run: |
          name="${{ steps.build.outputs.name }}"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd target && 7z a -tzip "$name.zip" "$name" > /dev/null)
            echo "file=target/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C target -czf "target/$name.tar.gz" "$name"
            echo "file=target/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: ${{ steps.pack.outputs.file }}
      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The jobs run at once: another may create the release first.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --clobber

  web-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasi-sdk 34
        run: tools/ci/wasi-sdk.sh
      - name: Install wasm-bindgen-cli 0.2.129
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Install binaryen 133
        run: tools/ci/binaryen.sh
      - name: Build the runtime folder
        id: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then version="$(git rev-parse --short HEAD)"; fi
          name="real-web-runtime-$version"
          cargo build --locked --release -p re_cli
          target/release/real build --runtime-only --target web --out "target/$name"
          rm "target/$name/.real-build"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Pack the runtime
        id: pack
        run: |
          name="${{ steps.build.outputs.name }}"
          tar -C target -czf "target/$name.tar.gz" "$name"
          echo "file=target/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: web-runtime
          path: ${{ steps.pack.outputs.file }}
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --clobber
