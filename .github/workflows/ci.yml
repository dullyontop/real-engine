# CI for Real Engine (ADR-0023, docs/M1_PLAN.md WP0).
#
# Required for merge: fmt, clippy, test, msrv, deny, xtask, verify-demo, xvfb-smoke
# and verify-plaza (all on Ubuntu; verify-plaza by ADR-0023's M2 amendment), and
# build-windows and build-macos (the whole suite and `real verify` on the island
# and the plaza; ADR-0023's M3 amendment, WP18 PR "blocking"), and build-web
# (ADR-0023's M3 amendment, WP29 PR "portable"), and d2 (the state_hash of every
# island and plaza replay agrees on the three platforms; ADR-0036, WP18 PR "d2").
# The GPU test step still skips crates that do not exist, a leftover from the
# first PRs. Action majors verified with `git ls-remote` on 2026-10-14:
# actions/checkout v7 (3d3c42e5), Swatinem/rust-cache v2 (49a0bdc7).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - name: No CRLF in tracked text files (.gitattributes, ADR-0036)
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /^i\/(crlf|mixed)$/ { print $NF }')
          if [ -n "$bad" ]; then echo "CRLF line endings in:"; echo "$bad"; exit 1; fi

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # Each test process records the compat members its scripts reach
      # (re_compat's class layer); the last step checks the union.
      REAL_COMPAT_MEMBER_TRACE: ${{ github.workspace }}/target/member-trace
      # Every 60th frame of the compat 3D view is also rebuilt from scratch and
      # compared, so a write that skips the change journal fails a test.
      REAL_RENDER_VERIFY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o /tmp/luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  /tmp/luau-lsp.zip" | sha256sum -c -
          sudo unzip -o /tmp/luau-lsp.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/luau-lsp
      - name: Test (non-GPU crates)
        # cargo only warns about excluded packages that do not exist yet.
        run: cargo test --workspace --locked --exclude re_render --exclude re_app --exclude re_cli --exclude re_editor --exclude re_web
      - name: Test (GPU crates, lavapipe and GL)
        run: |
          pkgs=""
          for c in re_render re_app re_cli re_editor re_web; do
            if [ -d "crates/$c" ]; then pkgs="$pkgs -p $c"; fi
          done
          if [ -z "$pkgs" ]; then echo "no GPU crates yet"; exit 0; fi
          vulkaninfo --summary || true          # records the runner's Mesa/lavapipe version in the log
          cargo test --locked $pkgs -- --test-threads=1
          if [ -d crates/re_render ]; then
            RE_BACKENDS=gl cargo test --locked -p re_render -- --test-threads=1
          fi
      - name: Every implemented compat member is called from a fixture (M2_PLAN, definition of done item 9)
        run: cargo xtask members "$REAL_COMPAT_MEMBER_TRACE"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  xtask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: cargo xtask check

  verify-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o /tmp/luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  /tmp/luau-lsp.zip" | sha256sum -c -
          sudo unzip -o /tmp/luau-lsp.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/luau-lsp
      - name: real verify on the demo
        run: |
          mkdir -p out
          cargo run --locked --release -p re_cli -- verify --project examples/island --json > out/verify.json
      - name: Check the verify report (M1_PLAN, definition of done item 2)
        # verify exits 0 when a stage is skipped, so the report itself is checked:
        # every stage ran and passed, at least three replays (each run twice with
        # the same state_hash, one of them regenerating the island, one the full
        # game), at least four goldens that match, and a PerfReport.
        run: |
          jq -e '
            .ok == true
            and ([.stages[].name] | contains(["schema", "compile", "scan", "boot", "replays", "goldens", "perf"]))
            and all(.stages[]; .ok and ((.data | type) != "object" or (.data | has("skipped") | not)))
            and ([.stages[] | select(.name == "replays") | .data.runs[]] as $r
                 | ($r | length) >= 3 and all($r[]; .deterministic) and any($r[]; (.regenerations | length) > 0)
                   and any($r[]; .file | endswith("full_game.replay.json")))
            and ([.stages[] | select(.name == "goldens") | .data.checks[]] as $g
                 | ($g | length) >= 4 and all($g[]; .matches))
            and (.perf | type == "object")
          ' out/verify.json
          jq -r '.stages[] | "\(.name): ok=\(.ok)"' out/verify.json
          jq -r '.stages[] | select(.name == "replays") | .data.runs[] | "replay \(.file): \(.frames) frames, deterministic=\(.deterministic), regenerations=\(.regenerations | length)"' out/verify.json
          jq -r '.stages[] | select(.name == "goldens") | .data.checks[] | "golden \(.golden): \(.summary)"' out/verify.json

  verify-plaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o /tmp/luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  /tmp/luau-lsp.zip" | sha256sum -c -
          sudo unzip -o /tmp/luau-lsp.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/luau-lsp
      - run: cargo build --locked --release -p re_cli
      - name: real check --types on the plaza
        run: target/release/real check --types --project examples/plaza
      - name: real verify on the plaza
        run: |
          mkdir -p out
          target/release/real verify --project examples/plaza --json > out/verify.json
      - name: Check the verify report (M2_PLAN, definition of done item 2)
        # Every stage ran and passed: the boot ran its 600 frames with no
        # uncaught error or stuck yield, the scan found nothing missing, at least
        # two replays ran twice with the same state_hash, and the goldens match.
        run: |
          jq -e '
            .ok == true
            and ([.stages[].name] | contains(["schema", "compile", "scan", "boot", "replays", "goldens", "perf"]))
            and all(.stages[]; .ok and ((.data | type) != "object" or (.data | has("skipped") | not)))
            and ([.stages[] | select(.name == "scan") | .data.missing] == [{}])
            and ([.stages[] | select(.name == "boot") | .data] as [$b]
                 | $b.frames == 600 and $b.uncaught == [] and $b.stuck_yields == [])
            and ([.stages[] | select(.name == "replays") | .data.runs[]] as $r
                 | ($r | length) >= 2 and all($r[]; .deterministic))
            and ([.stages[] | select(.name == "goldens") | .data.checks[]] as $g
                 | ($g | length) >= 2 and all($g[]; .matches))
            and (.perf | type == "object")
          ' out/verify.json
          jq -r '.stages[] | "\(.name): ok=\(.ok)"' out/verify.json
          jq -r '.stages[] | select(.name == "replays") | .data.runs[] | "replay \(.file): \(.frames) frames, deterministic=\(.deterministic)"' out/verify.json
          jq -r '.stages[] | select(.name == "goldens") | .data.checks[] | "golden \(.golden): \(.summary)"' out/verify.json
      - name: Windowed run under Xvfb (must print RUN OK)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" target/release/real run --project examples/plaza --frames 300 --exit-after | tee out/run.log
          grep -qx 'RUN OK' out/run.log

  verify-valley:
    # The M3 example (M3_PLAN WP28): a streamed world (ADR-0042). ADR-0023's
    # WP28 amendment makes it required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o /tmp/luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  /tmp/luau-lsp.zip" | sha256sum -c -
          sudo unzip -o /tmp/luau-lsp.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/luau-lsp
      - run: cargo build --locked --release -p re_cli
      - name: The committed walker model is what its generator writes
        run: |
          (cd examples/valley && python3 tools/make_walker.py)
          git diff --exit-code -- examples/valley/models/walker.glb
      - name: real check --types on the valley
        run: target/release/real check --types --project examples/valley
      - name: real verify on the valley
        run: |
          mkdir -p out
          target/release/real verify --project examples/valley --json > out/verify.json
      - name: Check the verify report (M3_PLAN WP28)
        # Every stage ran and passed, the walk, drive and cross-cell replays each
        # ran twice with the same state_hash, and at least six goldens match.
        run: |
          jq -e '
            .ok == true
            and ([.stages[].name] | contains(["schema", "compile", "scan", "boot", "replays", "goldens", "perf"]))
            and all(.stages[]; .ok and ((.data | type) != "object" or (.data | has("skipped") | not)))
            and ([.stages[] | select(.name == "replays") | .data.runs[]] as $r
                 | ($r | length) >= 3 and all($r[]; .deterministic)
                   and any($r[]; .file | endswith("walk.replay.json"))
                   and any($r[]; .file | endswith("drive.replay.json"))
                   and any($r[]; .file | endswith("cross.replay.json")))
            and ([.stages[] | select(.name == "goldens") | .data.checks[]] as $g
                 | ($g | length) >= 6 and all($g[]; .matches))
            and (.perf | type == "object")
          ' out/verify.json
          jq -r '.stages[] | "\(.name): ok=\(.ok)"' out/verify.json
          jq -r '.stages[] | select(.name == "replays") | .data.runs[] | "replay \(.file): \(.frames) frames, deterministic=\(.deterministic), state_hash=\(.state_hash)"' out/verify.json
          jq -r '.stages[] | select(.name == "goldens") | .data.checks[] | "golden \(.golden): \(.summary)"' out/verify.json
      - name: real verify on the valley with GL
        env:
          RE_BACKENDS: gl
        run: |
          target/release/real verify --project examples/valley --json > out/verify-gl.json
          jq -e '.ok == true and ([.stages[] | select(.name == "goldens") | .data.checks[]] | length >= 6 and all(.[]; .matches))' out/verify-gl.json
      - name: Windowed run under Xvfb (must print RUN OK)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" target/release/real run --project examples/valley --frames 300 --exit-after | tee out/run.log
          grep -qx 'RUN OK' out/run.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-valley
          path: |
            out/verify*.json
            examples/valley/.real/out/goldens/
          if-no-files-found: ignore

  xvfb-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: cargo build --locked --release -p re_cli
      - name: Windowed run under Xvfb (must print RUN OK)
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" target/release/real run --project examples/island --frames 300 --exit-after | tee out/run.log
          grep -qx 'RUN OK' out/run.log

  build-package:
    # ADR-0037, WP19 PR "archive": `real build` makes the Linux game folder,
    # and the packaged game plays as its project does (`real verify --package`).
    # Ubuntu 22.04 is the oldest supported runner, so a packaged game needs at
    # most its glibc (2.35). Not required yet: it joins ADR-0023's required
    # checks when PR "bundles" runs it on all three platforms.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: cargo build --locked --release -p re_cli
      - name: real build the island, the plaza and the valley
        run: |
          mkdir -p out
          for project in island plaza valley; do
            target/release/real build --project "examples/$project" --out "dist/$project" --json > "out/build-$project.json"
            jq -r '"\(.files | join(", ")): \(.entries | length) entries, \([.entries[].stored_size] | add) bytes"' "out/build-$project.json"
          done
      - name: real verify --package
        run: |
          for project in island plaza valley; do
            target/release/real verify --project "examples/$project" --package "dist/$project"
          done
      - name: The game needs at most glibc 2.35 and links no hot reload
        run: |
          need=$(objdump -T dist/island/island | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "highest glibc symbol version: $need"
          [ "$(printf '%s\n2.35\n' "$need" | sort -V | tail -1)" = "2.35" ]
          if nm dist/island/island | grep -q enable_hot_reload; then
            echo "the game links App::enable_hot_reload"; exit 1
          fi
          dist/island/island --runtime-info
          dist/island/island --version
      - name: The packaged game in a window under Xvfb
        # xvfb-run merges the command's stderr into its stdout, so the game's log
        # lines go to their own file and stdout stays one JSON document.
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" sh -c 'dist/island/island --frames 300 --json 2> out/run.log' > out/run.json
          jq -e '.frames == 300 and ([.diagnostics[] | select(.severity == "error")] | length == 0)' out/run.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-package-linux
          path: out/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install luau-lsp 1.70.1
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau-lsp.zip" https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-win64.zip
          echo "64225b9738102a30de6ee09fb28e5a3827edc402ecf2a6364af570312468159f  $RUNNER_TEMP/luau-lsp.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && unzip -o "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test (non-GPU crates)
        shell: bash
        run: cargo test --workspace --locked --no-fail-fast --exclude re_render --exclude re_app --exclude re_cli --exclude re_editor --exclude re_web
      - name: Test (GPU crates, DX12 on WARP)
        if: success() || failure()
        shell: bash
        env:
          RE_BACKENDS: dx12
        run: cargo test --locked --no-fail-fast -p re_render -p re_app -p re_cli -p re_editor -p re_web -- --test-threads=1
      - name: real verify on the island and the plaza
        if: success() || failure()
        shell: bash
        env:
          RE_BACKENDS: dx12
        run: |
          mkdir -p out
          cargo build --locked --release -p re_cli
          status=0
          for project in island plaza; do
            echo "== $project"
            report="out/verify-$project.json"
            target/release/real verify --project "examples/$project" --json > "$report" || true
            if ! jq -e '.stages' "$report" > /dev/null; then
              echo "::error::$project: real verify wrote no report"
              status=1
              continue
            fi
            jq -r '.stages[] | "\(.name): ok=\(.ok)"' "$report"
            jq -r '.stages[] | select(.ok | not) | .name as $n | .diagnostics[]? | "\($n): \(.code) \(.message)"' "$report"
            jq -c '.stages[] | select(.name == "goldens") | .data' "$report"
            # Every stage must pass, goldens included: each backend has its own set
            # (vulkan and gl blessed on Linux, dx12 on Windows, metal on macOS).
            jq -e '.ok == true' "$report" > /dev/null || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-windows
          path: |
            out/verify-*.json
            examples/island/.real/out/goldens/
            examples/plaza/.real/out/goldens/
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau-lsp.zip" https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-macos.zip
          echo "7d3936e8dec6dc77547abd061d2e950da392562a5f94858b880f23dba50d84cd  $RUNNER_TEMP/luau-lsp.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin" && unzip -o "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/luau-lsp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test (non-GPU crates)
        run: cargo test --workspace --locked --no-fail-fast --exclude re_render --exclude re_app --exclude re_cli --exclude re_editor --exclude re_web
      - name: Test (GPU crates, Metal)
        if: success() || failure()
        env:
          RE_BACKENDS: metal
        run: cargo test --locked --no-fail-fast -p re_render -p re_app -p re_cli -p re_editor -p re_web -- --test-threads=1
      - name: real verify on the island and the plaza
        if: success() || failure()
        env:
          RE_BACKENDS: metal
        run: |
          mkdir -p out
          cargo build --locked --release -p re_cli
          status=0
          for project in island plaza; do
            echo "== $project"
            report="out/verify-$project.json"
            target/release/real verify --project "examples/$project" --json > "$report" || true
            if ! jq -e '.stages' "$report" > /dev/null; then
              echo "::error::$project: real verify wrote no report"
              status=1
              continue
            fi
            jq -r '.stages[] | "\(.name): ok=\(.ok)"' "$report"
            jq -r '.stages[] | select(.ok | not) | .name as $n | .diagnostics[]? | "\($n): \(.code) \(.message)"' "$report"
            jq -c '.stages[] | select(.name == "goldens") | .data' "$report"
            # Every stage must pass, goldens included: each backend has its own set
            # (vulkan and gl blessed on Linux, dx12 on Windows, metal on macOS).
            jq -e '.ok == true' "$report" > /dev/null || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-macos
          path: |
            out/verify-*.json
            examples/island/.real/out/goldens/
            examples/plaza/.real/out/goldens/
          if-no-files-found: ignore

  # ADR-0049 (WP29): the browser build. Type-checks and lints the runtime for
  # wasm32-unknown-unknown (the std::time ban runs only here, ADR-0049 §5), then links
  # tools/web-test with Luau and Jolt built by wasi-sdk and compares its report under
  # Node with the native one. Then `real build --target web` builds the island and the
  # plaza (the runtime with profile `web` and wasm-opt, failing above 8 MB gzipped)
  # and, serving each folder in headless Chromium with WebGPU, plays their replays
  # from game.rpak (no error, a drawn last frame) and starts the island's game page.
  # Every line of the Node report, the Jolt pile hash included, and every replay's
  # state_hash must match native (ADR-0036, WP18 PR "d2").
  # actions/setup-node v7 (949feb24) verified with `git ls-remote` on 2026-10-20.
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The native replay runner below links ALSA and udev, like every native build.
      - uses: ./.github/actions/linux-setup
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web-test/package-lock.json
      - name: Install wasi-sdk 34
        run: tools/ci/wasi-sdk.sh
      - name: Install wasm-bindgen-cli 0.2.129
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Clippy for wasm32 (web clippy.toml), which also type-checks the runtime
        run: >-
          CLIPPY_CONF_DIR=$PWD/tools/ci/clippy-web
          cargo clippy --locked --target wasm32-unknown-unknown
          -p re_core -p re_types -p re_geom -p re_noise -p re_reflect -p re_scene
          -p re_command -p re_anim -p re_proc -p re_input -p re_audio -p re_render
          -p re_script -p re_physics -p re_compat -p re_net -p re_app -p re_web
          -p web-test -- -D warnings
      - name: Luau and Jolt in wasm match native
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p web-test
          wasm-bindgen --target web --out-dir target/web-test target/wasm32-unknown-unknown/release/web_test.wasm
          cargo run --locked --release -p web-test > target/web-test/native.txt
          node --experimental-wasm-exnref tools/web-test/smoke.mjs target/web-test target/web-test/native.txt
      - name: Install binaryen 133
        run: tools/ci/binaryen.sh
      - name: Install Playwright's Chromium
        working-directory: tools/web-test
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # real build --target web for the island and the plaza (failing above the 8 MB
      # gzip budget), their replays from game.rpak in headless Chromium with WebGPU,
      # and the island's game page.
      - name: cargo xtask web-test
        run: cargo xtask web-test

  # D2 (ADR-0036): every replay of the island and the plaza, run on each
  # platform, writes its state_hash every 60 frames; `d2` compares them.
  d2-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-setup
      - if: runner.os != 'Linux'
        run: rustup toolchain install stable --profile minimal
      - if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
      - name: State hashes of every replay
        shell: bash
        run: |
          mkdir -p out
          cargo xtask d2 --project examples/island --project examples/plaza --json --out out/d2.json
      - uses: actions/upload-artifact@v7
        with:
          name: d2-${{ runner.os }}
          path: out/d2.json

  # Linux x86_64, Windows x86_64 and macOS arm64 must agree checkpoint for
  # checkpoint (ADR-0036; macOS matched from this PR's first run on).
  d2:
    needs: d2-run
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@v8
        with:
          pattern: d2-*
          path: out
      - name: Compare the platforms
        run: cargo xtask d2 compare out/*/d2.json --require linux-x86_64,windows-x86_64,macos-aarch64
