# CI for Real Engine (ADR-0023, docs/M1_PLAN.md WP0).
#
# Required for merge: fmt, clippy, test, msrv, deny, xtask, verify-demo, xvfb-smoke
# and verify-plaza (all on Ubuntu; verify-plaza by ADR-0023's M2 amendment).
# build-windows and build-macos are reported only.
# The GPU test step still skips crates that do not exist, a leftover from the
# first PRs. Action majors verified with `git ls-remote` on 2026-10-14:
# actions/checkout v7 (3d3c42e5), Swatinem/rust-cache v2 (49a0bdc7).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # Each test process records the compat members its scripts reach
      # (re_compat's class layer); the last step checks the union.
      REAL_COMPAT_MEMBER_TRACE: ${{ github.workspace }}/target/member-trace
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o /tmp/luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  /tmp/luau-lsp.zip" | sha256sum -c -
          sudo unzip -o /tmp/luau-lsp.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/luau-lsp
      - name: Test (non-GPU crates)
        # cargo only warns about excluded packages that do not exist yet.
        run: cargo test --workspace --locked --exclude re_render --exclude re_app --exclude re_cli --exclude re_editor
      - name: Test (GPU crates, lavapipe and GL)
        run: |
          pkgs=""
          for c in re_render re_app re_cli re_editor; do
            if [ -d "crates/$c" ]; then pkgs="$pkgs -p $c"; fi
          done
          if [ -z "$pkgs" ]; then echo "no GPU crates yet"; exit 0; fi
          vulkaninfo --summary || true          # records the runner's Mesa/lavapipe version in the log
          cargo test --locked $pkgs -- --test-threads=1
          if [ -d crates/re_render ]; then
            RE_BACKENDS=gl cargo test --locked -p re_render -- --test-threads=1
          fi
      - name: Every implemented compat member is called from a fixture (M2_PLAN, definition of done item 9)
        run: cargo xtask members "$REAL_COMPAT_MEMBER_TRACE"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  xtask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: cargo xtask check

  verify-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o /tmp/luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  /tmp/luau-lsp.zip" | sha256sum -c -
          sudo unzip -o /tmp/luau-lsp.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/luau-lsp
      - name: real verify on the demo
        run: |
          mkdir -p out
          cargo run --locked --release -p re_cli -- verify --project examples/island --json > out/verify.json
      - name: Check the verify report (M1_PLAN, definition of done item 2)
        # verify exits 0 when a stage is skipped, so the report itself is checked:
        # every stage ran and passed, at least three replays (each run twice with
        # the same state_hash, one of them regenerating the island, one the full
        # game), at least four goldens that match, and a PerfReport.
        run: |
          jq -e '
            .ok == true
            and ([.stages[].name] | contains(["schema", "compile", "scan", "boot", "replays", "goldens", "perf"]))
            and all(.stages[]; .ok and ((.data | type) != "object" or (.data | has("skipped") | not)))
            and ([.stages[] | select(.name == "replays") | .data.runs[]] as $r
                 | ($r | length) >= 3 and all($r[]; .deterministic) and any($r[]; (.regenerations | length) > 0)
                   and any($r[]; .file | endswith("full_game.replay.json")))
            and ([.stages[] | select(.name == "goldens") | .data.checks[]] as $g
                 | ($g | length) >= 4 and all($g[]; .matches))
            and (.perf | type == "object")
          ' out/verify.json
          jq -r '.stages[] | "\(.name): ok=\(.ok)"' out/verify.json
          jq -r '.stages[] | select(.name == "replays") | .data.runs[] | "replay \(.file): \(.frames) frames, deterministic=\(.deterministic), regenerations=\(.regenerations | length)"' out/verify.json
          jq -r '.stages[] | select(.name == "goldens") | .data.checks[] | "golden \(.golden): \(.summary)"' out/verify.json

  verify-plaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - name: Install luau-lsp 1.70.1
        run: |
          curl -fsSL -o /tmp/luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  /tmp/luau-lsp.zip" | sha256sum -c -
          sudo unzip -o /tmp/luau-lsp.zip -d /usr/local/bin && sudo chmod +x /usr/local/bin/luau-lsp
      - run: cargo build --locked --release -p re_cli
      - name: real check --types on the plaza
        run: target/release/real check --types --project examples/plaza
      - name: real verify on the plaza
        run: |
          mkdir -p out
          target/release/real verify --project examples/plaza --json > out/verify.json
      - name: Check the verify report (M2_PLAN, definition of done item 2)
        # Every stage ran and passed: the boot ran its 600 frames with no
        # uncaught error or stuck yield, the scan found nothing missing, at least
        # two replays ran twice with the same state_hash, and the goldens match.
        run: |
          jq -e '
            .ok == true
            and ([.stages[].name] | contains(["schema", "compile", "scan", "boot", "replays", "goldens", "perf"]))
            and all(.stages[]; .ok and ((.data | type) != "object" or (.data | has("skipped") | not)))
            and ([.stages[] | select(.name == "scan") | .data.missing] == [{}])
            and ([.stages[] | select(.name == "boot") | .data] as [$b]
                 | $b.frames == 600 and $b.uncaught == [] and $b.stuck_yields == [])
            and ([.stages[] | select(.name == "replays") | .data.runs[]] as $r
                 | ($r | length) >= 2 and all($r[]; .deterministic))
            and ([.stages[] | select(.name == "goldens") | .data.checks[]] as $g
                 | ($g | length) >= 2 and all($g[]; .matches))
            and (.perf | type == "object")
          ' out/verify.json
          jq -r '.stages[] | "\(.name): ok=\(.ok)"' out/verify.json
          jq -r '.stages[] | select(.name == "replays") | .data.runs[] | "replay \(.file): \(.frames) frames, deterministic=\(.deterministic)"' out/verify.json
          jq -r '.stages[] | select(.name == "goldens") | .data.checks[] | "golden \(.golden): \(.summary)"' out/verify.json
      - name: Windowed run under Xvfb (must print RUN OK)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" target/release/real run --project examples/plaza --frames 300 --exit-after | tee out/run.log
          grep -qx 'RUN OK' out/run.log

  xvfb-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-setup
      - run: cargo build --locked --release -p re_cli
      - name: Windowed run under Xvfb (must print RUN OK)
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" target/release/real run --project examples/island --frames 300 --exit-after | tee out/run.log
          grep -qx 'RUN OK' out/run.log

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - name: Test (pure-Rust crates)
        # Runs even when the workspace build failed, so WP0's scope is always reported.
        if: success() || failure()
        shell: bash
        run: |
          pkgs=""
          for c in re_core re_noise re_types re_reflect re_scene re_command; do
            if [ -d "crates/$c" ]; then pkgs="$pkgs -p $c"; fi
          done
          cargo test --locked $pkgs

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - name: Test (pure-Rust crates)
        # Runs even when the workspace build failed, so WP0's scope is always reported.
        if: success() || failure()
        shell: bash
        run: |
          pkgs=""
          for c in re_core re_noise re_types re_reflect re_scene re_command; do
            if [ -d "crates/$c" ]; then pkgs="$pkgs -p $c"; fi
          done
          cargo test --locked $pkgs
