name: Linux setup
description: >
  System packages from docs/DEPENDENCIES.md ("System packages"), the Rust
  toolchain rust-toolchain.toml pins, with rustfmt and clippy, and the cargo
  cache (.github/actions/cargo-cache). The packages apt downloads and the cargo
  cache are restored on every run and saved only on main (ADR-0023's amendment
  of 2026-10-28), so PR runs never fill the repository's 10 GB of caches.
inputs:
  cargo-cache:
    description: >
      A name for the job's cargo cache, which jobs that build exactly the same
      thing can share (`release`: release `real` on ubuntu-latest, in
      `verify`). Empty, the job has its own cache.
    required: false
    default: ""
  free-disk:
    description: >
      "true" deletes preinstalled SDKs no job here uses (Android, .NET, Haskell,
      Swift, CodeQL), for the jobs that link every test binary: a private
      repository's runners have too little free disk for those builds.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk == 'true'
      shell: bash
      # In the background, while the next steps download; the last step waits.
      # Its input and output are files, or the step would wait for it to finish.
      run: |
        df -h /
        sudo sh -c 'rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
          /usr/share/swift /opt/hostedtoolcache/CodeQL; touch /tmp/real-engine-disk-freed' \
          < /dev/null > /tmp/real-engine-free-disk.log 2>&1 &
    - name: The key of the downloaded packages
      id: apt-key
      shell: bash
      # The runner image (ImageOS, ImageVersion) and this file, for its package list.
      run: |
        list="$(sha256sum "$GITHUB_ACTION_PATH/action.yml" | cut -c1-16)"
        echo "image=apt-${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "key=apt-${ImageOS:-unknown}-${ImageVersion:-unknown}-$list" >> "$GITHUB_OUTPUT"
    - name: Restore the downloaded packages
      id: apt-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/real-engine/apt
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: ${{ steps.apt-key.outputs.image }}-
    - name: Install system packages
      shell: bash
      # The runners' Ubuntu mirror sometimes serves a runner at 40-60 kB/s, which
      # made this step take 12-20 minutes in a third of the jobs. apt fetches only
      # the packages the cache lacks; autoclean then drops versions the mirror no
      # longer has, so the cache does not grow.
      run: |
        cache="$HOME/.cache/real-engine/apt"
        mkdir -p "$cache"
        if compgen -G "$cache/*.deb" > /dev/null; then
          sudo cp "$cache"/*.deb /var/cache/apt/archives/
        fi
        sudo apt-get update
        sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true \
          build-essential g++ cmake pkg-config \
          libvulkan-dev mesa-vulkan-drivers vulkan-tools \
          libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 \
          libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libxcursor-dev libxrandr-dev libxi-dev libwayland-dev \
          libasound2-dev libudev-dev \
          xvfb
        sudo apt-get autoclean -y > /dev/null
        rm -f "$cache"/*.deb
        if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
          cp /var/cache/apt/archives/*.deb "$cache"/
        fi
    - name: Save the downloaded packages
      if: github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/real-engine/apt
        key: ${{ steps.apt-key.outputs.key }}
    - name: Install the pinned toolchain
      shell: bash
      # rust-toolchain.toml names it, with its profile and components; the
      # script also removes the image's own toolchains, which would otherwise
      # be part of the cargo cache's key.
      run: bash tools/ci/rust-toolchain.sh
    - name: Cache cargo
      uses: ./.github/actions/cargo-cache
      with:
        shared-key: ${{ inputs.cargo-cache }}
    - name: Wait for the disk space
      if: inputs.free-disk == 'true'
      shell: bash
      run: |
        if ! timeout 600 sh -c 'until [ -e /tmp/real-engine-disk-freed ]; do sleep 2; done'; then
          echo "::warning::The preinstalled SDKs were still being deleted after 10 minutes."
        fi
        df -h /
