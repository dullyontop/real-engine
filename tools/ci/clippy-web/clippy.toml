# Clippy settings for the wasm32 pass in CI's build-web job (ADR-0049 §5), used through
# CLIPPY_CONF_DIR. Clippy reads one file, so this is the root clippy.toml plus the
# web-only entries at the end; `cargo xtask check` (clippy-web) fails if the copies drift.
#
# The web-only entries panic on wasm32-unknown-unknown. They live only here: on desktop,
# web-time re-exports std::time, so re_core::time::Instant::now is std's and a ban there
# would flag every correct use; std::process::id has correct desktop users.
# The rest is clippy.toml's list, sorted by path as there.
disallowed-methods = [
    { path = "f32::acos", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::acosh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::asin", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::asinh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::atan", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::atan2", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::atanh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::cbrt", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::cos", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::cosh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::exp", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::exp2", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::exp_m1", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::hypot", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::ln", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::ln_1p", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::log", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::log10", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::log2", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::powf", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::sin", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::sin_cos", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::sinh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::tan", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f32::tanh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::acos", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::acosh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::asin", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::asinh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::atan", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::atan2", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::atanh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::cbrt", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::cos", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::cosh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::exp", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::exp2", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::exp_m1", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::hypot", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::ln", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::ln_1p", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::log", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::log10", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::log2", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::powf", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::sin", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::sin_cos", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::sinh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::tan", reason = "platform libm; use libm (ADR-0036)" },
    { path = "f64::tanh", reason = "platform libm; use libm (ADR-0036)" },
    { path = "std::time::Duration::from_secs_f32", reason = "panics when negative, non-finite or too large; use Duration::try_from_secs_f32" },
    { path = "std::time::Duration::from_secs_f64", reason = "panics when negative, non-finite or too large; use Duration::try_from_secs_f64" },
    { path = "std::time::Instant::now", reason = "panics on wasm32-unknown-unknown; use re_core::time (ADR-0049 §5)" },
    { path = "std::time::SystemTime::now", reason = "panics on wasm32-unknown-unknown; use re_core::time (ADR-0049 §5)" },
    { path = "std::process::id", reason = "panics on wasm32-unknown-unknown; use re_core::process_id (ADR-0049 §5)" },
]
