[package]
name = "re_assets"
description = "Real Engine assets: glTF import, material files, asset ids, the processed-asset cache and hot reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Subsystem crate: depends only on the contract layer and third-party crates
# (ARCHITECTURE §2; `cargo xtask check-graph` enforces it).
[dependencies]
re_core.workspace = true
re_types.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
blake3.workspace = true
uuid.workspace = true
gltf.workspace = true
image.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
thiserror.workspace = true
tracing.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Derives `schemars::JsonSchema` for `MaterialFile`, so that `real schema` (WP6)
# generates `material.schema.json` from it.
schemars = ["dep:schemars"]

[dev-dependencies]
tempfile.workspace = true
