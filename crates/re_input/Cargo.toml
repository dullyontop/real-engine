[package]
name = "re_input"
description = "Real Engine input: raw device state from winit and gilrs, the action map, and replays."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Subsystem crate: depends only on the contract layer and third-party crates
# (ARCHITECTURE §2; `cargo xtask check-graph` enforces it).
[dependencies]
re_core.workspace = true
re_types.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
winit.workspace = true
# Keep gilrs default features: gilrs-core fails to build on every OS without `wgi` or `xinput`.
gilrs.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
