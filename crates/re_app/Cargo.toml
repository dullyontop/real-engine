[package]
name = "re_app"
description = "Real Engine runtime: the frame loop, the sync glue between the World and the subsystems, the headless runner, `real verify` and the runtime commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Runtime crate (ADR-0027): no tokio, rmcp or full_moon (`cargo xtask check-graph`).
# Workspace crates without a `[workspace.dependencies]` entry yet are named by path;
# the maintainer moves them to `.workspace = true` lines.
[dependencies]
re_core.workspace = true
re_types.workspace = true
re_reflect.workspace = true
re_scene.workspace = true
re_command.workspace = true
re_input = { path = "../re_input" }
re_physics = { path = "../re_physics" }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
blake3.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
