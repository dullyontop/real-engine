[package]
name = "re_app"
description = "Real Engine runtime: the frame loop, the sync glue between the World and the subsystems, the headless runner, `real verify` and the runtime commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Runtime crate (ADR-0027): no tokio, rmcp or full_moon (`cargo xtask check-graph`).
[dependencies]
re_core.workspace = true
re_types.workspace = true
re_reflect.workspace = true
re_scene.workspace = true
re_command.workspace = true
re_input.workspace = true
re_physics.workspace = true
re_render.workspace = true
re_assets.workspace = true
re_audio.workspace = true
re_anim.workspace = true
re_script.workspace = true
re_compat.workspace = true
re_net.workspace = true
re_proc.workspace = true
re_geom.workspace = true
winit.workspace = true
glam.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
blake3.workspace = true
postcard.workspace = true
# The package archive (ADR-0037); the browser runtime reads it from memory (ADR-0049 §6).
zstd.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser runtime awaits the GPU device (src/web/play.rs, ADR-0049).
wasm-bindgen-futures.workspace = true

[dev-dependencies]
re_import.workspace = true
tempfile.workspace = true
