[package]
name = "re_compat"
description = "Real Engine Roblox-style compatibility layer: the class layer, the class, enum and library data, the coverage table and the compat scene conventions (ADR-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A runtime crate (ADR-0027). The dependency set is the one docs/M2_PLAN.md
# gives WP9's skeleton, so WP10 and WP11 can bind datatypes and instances to
# Luau (mlua) and issue commands (re_command) without editing this file.
[dependencies]
re_core.workspace = true
re_types.workspace = true
re_reflect.workspace = true
re_scene.workspace = true
re_command.workspace = true
re_script.workspace = true
# Keyframe sampling, track blending and two-bone IK for the Animator (WP14).
# re_anim is plain computation (re_core, re_types, glam, serde).
re_anim.workspace = true
# Characters ride re_physics character controllers in the compat world's
# physics (ARCHITECTURE §2, the re_compat::physics exception).
re_physics.workspace = true
mlua.workspace = true
glam.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
thiserror.workspace = true
# WP15: text layout and the UI's shapes; painting goes through re_render's
# UiFrame in the host.
egui.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Replays of raw input drive the character tests (WP14).
re_input.workspace = true
# The sample runner (tests/samples.rs) imports each sample and boots and
# plays it through the runtime (WP16).
re_import.workspace = true
re_app.workspace = true
# WP15: the UI golden images paint through re_render.
re_render.workspace = true
