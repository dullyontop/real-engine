[package]
name = "re_compat"
description = "Real Engine Roblox-style compatibility layer: the class layer, the class, enum and library data, the coverage table and the compat scene conventions (ADR-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A runtime crate (ADR-0027). The dependency set is the one docs/M2_PLAN.md
# gives WP9's skeleton, so WP10 and WP11 can bind datatypes and instances to
# Luau (mlua) and issue commands (re_command) without editing this file.
[dependencies]
re_core.workspace = true
re_types.workspace = true
re_reflect.workspace = true
re_scene.workspace = true
re_command.workspace = true
re_script.workspace = true
mlua.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
glam.workspace = true
tempfile.workspace = true
# The sample runner (tests/samples.rs) imports each sample (WP16).
re_import.workspace = true
