[package]
name = "re_proc"
description = "Real Engine procedural core: the ProcGraph IR, the M1 node set, a deterministic cached parallel evaluator, the `graph` generator and the graph.* commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Reaches no wgpu, oxijolt or mlua (ARCHITECTURE §2; `cargo xtask check-graph`
# enforces it). bevy_ecs only through the `re_scene::ecs` re-export.
[dependencies]
re_core.workspace = true
re_types = { workspace = true, features = ["schemars"] }
re_noise.workspace = true
re_geom.workspace = true
re_reflect.workspace = true
re_scene.workspace = true
re_command.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
indexmap.workspace = true
blake3.workspace = true
postcard.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
