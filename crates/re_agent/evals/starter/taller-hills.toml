prompt = "Make the hills of this landscape about twice as tall."
project = { template = "terrain", params = { seed = 3 } }
budget = { tool_calls = 20, seconds = 300 }

# The template's hills are 16 m high; "about twice" is 32 m, give or take 2.
[[checks]]
command = "graph.generate"
args = { source = "terrain" }
pointer = "/data/params/height/height"
near = 32.0
tolerance = 2.0

[[checks]]
command = "query"
args = { generated = true }
pointer = "/data/total"
at_least = 2

[[checks]]
no_regressions = true

[[reference]]
command = "graph.set_param"
args = { source = "terrain", node = "height", param = "height", value = 32.0 }

[[reference]]
command = "graph.regenerate"
args = { source = "terrain" }
