[package]
name = "re_agent"
description = "Real Engine agent tooling: policy, sessions and checkpoints, agent commands, AGENTS.md and client configs, the single-writer project lock and the editor socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Tooling crate (ADR-0027): re_cli links it only with the `tooling` feature.
# No tokio here (`cargo xtask check-graph`): the editor socket is plain std.
[dependencies]
re_core.workspace = true
re_command.workspace = true
re_scene.workspace = true
re_reflect.workspace = true
re_script.workspace = true
re_types.workspace = true
re_compat.workspace = true
schemars.workspace = true
toml.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
glam.workspace = true
indexmap.workspace = true
