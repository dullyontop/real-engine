[package]
name = "re_core"
description = "Real Engine contract layer: diagnostics, fixed-step time, frame phases, the task pool, events, profiling and logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# `profile_scope!` records puffin scopes.
profile-puffin = ["dep:puffin"]
# `profile_scope!` records Tracy zones (builds the Tracy C++ client).
profile-tracy = ["dep:tracy-client"]

[dependencies]
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
web-time.workspace = true
puffin = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }
