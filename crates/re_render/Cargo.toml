[package]
name = "re_render"
description = "Real Engine renderer: wgpu forward renderer, GPU resources, headless capture and egui painting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A subsystem crate (ADR-0006): it depends only on the contract layer and on
# third-party crates, never on re_scene or another subsystem.
[dependencies]
re_core.workspace = true
re_types.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
png.workspace = true
tracing.workspace = true

[dev-dependencies]
winit.workspace = true
egui-winit.workspace = true

[[example]]
name = "re-imgdiff"
path = "examples/re_imgdiff.rs"

[[example]]
name = "windowed_smoke"
path = "examples/windowed_smoke.rs"
