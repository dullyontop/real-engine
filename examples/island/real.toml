[project]
name = "island"
entry_scene = "scenes/main.scene.json"

[render]
width = 1280
height = 720

[input.buttons]
jump = ["key:Space", "pad:South"]
restart = ["key:KeyR", "pad:Start"]
regenerate = ["key:KeyG", "pad:North"]

[input.axes]
move = [{ composite = ["key:KeyW", "key:KeyS", "key:KeyA", "key:KeyD"] }, { stick = "left", dead_zone = 0.15 }]
look = [{ mouse_delta = 0.003 }, { stick = "right", dead_zone = 0.15 }]

# `real build` (ADR-0037): the identifier names the folders the packaged game
# saves in; the icon is the app's, the window's and the desktop entry's.
[package]
identifier = "com.example.island"
display_name = "Island"
icon = "icon.png"
