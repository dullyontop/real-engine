[workspace]
members = ["crates/*", "tools/*"]
# third_party/: patched copies of crates.io crates (ADR-0049 §2), used through
# [patch.crates-io] below. tools/ci/: CI scripts, not a crate.
exclude = ["third_party", "tools/ci"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Every third-party crate the engine may use, at the exact version recorded in
# docs/DEPENDENCIES.md. Member crates write `foo.workspace = true`. Adding a crate
# here needs an ADR in docs/DECISIONS.md and a row in docs/DEPENDENCIES.md.
[workspace.dependencies]
# Workspace crates.
re_core = { path = "crates/re_core" }
re_noise = { path = "crates/re_noise" }
re_types = { path = "crates/re_types" }
re_reflect = { path = "crates/re_reflect" }
re_reflect_derive = { path = "crates/re_reflect_derive" }
re_scene = { path = "crates/re_scene" }
re_command = { path = "crates/re_command" }
re_render = { path = "crates/re_render" }
re_physics = { path = "crates/re_physics" }
re_assets = { path = "crates/re_assets" }
re_input = { path = "crates/re_input" }
re_net = { path = "crates/re_net" }
re_audio = { path = "crates/re_audio" }
re_anim = { path = "crates/re_anim" }
re_geom = { path = "crates/re_geom" }
re_proc = { path = "crates/re_proc" }
re_script = { path = "crates/re_script" }
re_script_check = { path = "crates/re_script_check" }
re_ui = { path = "crates/re_ui" }
re_compat = { path = "crates/re_compat" }
re_import = { path = "crates/re_import" }
re_app = { path = "crates/re_app" }
re_agent = { path = "crates/re_agent" }
re_mcp = { path = "crates/re_mcp" }
re_editor = { path = "crates/re_editor" }

# Rendering, windowing, UI.
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = "=0.36.2"
egui_dock = { version = "=0.21.1", features = ["serde"] }
egui-snarl = { version = "=0.12.0", features = ["serde"] }
glam = { version = "=0.34.1", features = ["bytemuck", "libm", "mint-05", "scalar-math", "serde"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
png = "=0.18.1"
# Block-compressed textures (ADR-0047): the encoder runs at import, in tooling
# builds only (re_assets' `texture-encode`); the decoder is the renderer's
# fallback for GPUs without BC formats.
block_compression = { version = "=0.10.1", default-features = false, features = ["bc15", "bc7"] }
bcdec_rs = "=0.2.0"

# Physics. Default features off: the default `prebuilt` feature downloads binaries.
oxijolt = { version = "=1.1.0", default-features = false, features = ["cross-platform-deterministic"] }

# Scripting and script tooling.
mlua = { version = "=0.12.2", features = ["luau"] }
full_moon = { version = "=3.0.0", features = ["luau"] }
# Place files (WP27 "place files", ADR-0048): re_import only.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
ruzstd = { version = "=0.9.1", default-features = false, features = ["std"] }
quick-xml = "=0.41.0"
base64 = "=0.23.1"

# Polygon booleans and triangulation (ADR-0043 §5): re_geom only.
i_overlay = { version = "=9.1.0", default-features = false }
earcut = "=0.4.11"

# Core, data and serialization.
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded"] }
rayon = "=1.12.0"
# Portable maths (ADR-0036): the same bits on every platform, instead of the C library.
libm = "=0.2.16"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
schemars = { version = "=1.2.3", features = ["derive"] }
toml = "=1.1.8"
postcard = { version = "=1.1.3", features = ["use-std"] }
blake3 = "=1.8.7"
zstd = { version = "=0.14.3", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_System_Console"] }
uuid = { version = "=1.28.0", features = ["v4", "serde", "js"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"

# Proc macros (re_reflect_derive only).
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = "=2.0.119"

# Assets, input, audio, platform.
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
kira = { version = "=0.12.5", default-features = false, features = ["cpal"] }
gilrs = "=0.11.2"
# The wall clock, also on wasm32-unknown-unknown (ADR-0049).
web-time = "=1.1.0"
# JavaScript bindings of the browser build (ADR-0049).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
# The browser's WebSocket for online play (ADR-0049 §10, ADR-0050's amendment for
# PR "web"): re_net only. Both were in the lockfile already through wgpu and winit.
web-sys = { version = "=0.3.106", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent"] }
js-sys = "=0.3.106"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "ansi", "json"] }
puffin = "=0.20.0"
tracy-client = { version = "=0.19.0", default-features = false, features = ["enable", "ondemand"] }

# Networking (ADR-0050's amendment for PR "web"): the WebSocket listener beside a
# server's UDP socket and the native WebSocket client; re_net only, no TLS.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

# Tools, CLI, agent.
clap = { version = "=4.6.7", features = ["derive"] }
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
# The HTTP server under rmcp's streamable HTTP service (ADR-0046).
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "server", "http1", "service"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "io-std"] }

# Dev-dependencies.
insta = { version = "=1.49.0", features = ["json"] }
tempfile = "=3.27.0"
# Property tests of the modelling kernel (ADR-0062 §12): re_geom only, with no
# failure files and fixed seeds. Without default features: no fork or timeout.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

# Temporary patched copies for wasm32-unknown-unknown (ADR-0049 §2), removed when upstream
# releases carry the changes. Both are the crates.io sources of the versions pinned above
# plus research/m3/wp29/upstream/'s diffs; see third_party/README.md.
[patch.crates-io]
mlua = { path = "third_party/mlua" }
oxijolt-sys = { path = "third_party/oxijolt-sys" }

[profile.dev]
debug = "line-tables-only"

# The packaged game's runtime (ADR-0037; cargo reserves the name `package`):
# `real build` builds it with `--no-default-features --features game`. Debug
# info is stripped but symbols stay, so crash backtraces keep function names.
[profile.packaged]
inherits = "release"
strip = "debuginfo"

# The browser build (ADR-0049): `cargo build --profile web --target wasm32-unknown-unknown`,
# then wasm-opt -Oz. Smaller than release: 6.9 MB gzip against 9.1 MB for the full runtime
# (research/m3/wp29/measurements.md §8); build-web fails above the 10 MB budget.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
