name = "falling-box"
summary = "Drop a dynamic box into the scene: it falls and comes to rest on whatever is below."

[[params]]
name = "label"
type = "string"
default = "Falling box"
doc = "The new entity's name."

[[params]]
name = "x"
type = "float"
default = 0.0
doc = "Where it starts, east to west (metres)."

[[params]]
name = "z"
type = "float"
default = 0.0
doc = "Where it starts, north to south (metres)."

[[params]]
name = "height"
type = "float"
default = 6.0
min = 0.5
max = 200.0
doc = "How high it starts (metres)."

[[params]]
name = "size"
type = "float"
default = 1.0
min = 0.1
max = 20.0
doc = "The length of its sides (metres)."

[[params]]
name = "mass"
type = "float"
default = 10.0
min = 0.01
doc = "Its mass (kilograms)."

[[steps]]
command = "entity.spawn"
[steps.args]
name = "{{label}}"
[steps.args.components]
Collider = { shape = "Box", half_extents = [0.5, 0.5, 0.5] }
MeshRef = { asset = "builtin:cube" }
RigidBody = { kind = "Dynamic", mass = "{{mass}}" }
Transform = { translation = ["{{x}}", "{{height}}", "{{z}}"], scale = ["{{size}}", "{{size}}", "{{size}}"] }

[[checks]]
command = "query"
args = { name = "{{label}}" }
pointer = "/data/total"
at_least = 1

[[checks]]
no_regressions = true
